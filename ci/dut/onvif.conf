# Minimal onvif_simple_server config for the CI virtual ONVIF device.
#
# Stripped-down version of the upstream
# `onvif_simple_server.conf.example` — keeps only the fields onvif-tt's
# CI-allowlisted tests actually exercise. No PTZ, no relays, no event
# input files (those need a writable /tmp tree we set up at start).

model=OpenIPC-CI-DUT
manufacturer=OpenIPC
firmware_ver=ci-1.0.0
hardware_id=ci-0001
serial_num=ci-onvif-tt-runner
# 'ifs' is the interface name the binary reads its IP from to substitute
# into the url=/snapurl= '%s' placeholders. `lo` → 127.0.0.1, which is
# exactly what we want for CI localhost testing.
ifs=lo
port=8080
scope=onvif://www.onvif.org/Profile/Streaming
scope=onvif://www.onvif.org/Profile/T
scope=onvif://www.onvif.org/hardware
scope=onvif://www.onvif.org/name
# Auth deliberately disabled for the CI integration job — upstream
# onvif_simple_server requires a working WS-UsernameToken digest match
# on every operation when user= is set, and the Nonce/Created/Date
# digest computation occasionally drifts between python-onvif-zeep and
# the upstream's hash routine across releases. Disabling auth here
# keeps the integration job stable across upstream pulls. The
# LOCAL-AUTH-* tests (which exercise the auth path) are not in the
# integration job's allowlist anyway; they run against real cameras
# during dev / regression sessions.
#user=admin
#password=admin
adv_enable_media2=1
adv_fault_if_unknown=1
adv_fault_if_set=0
adv_synology_nvr=0

# Profile 0 — H.264, 1920x1080.
name=Profile_0
width=1920
height=1080
url=rtsp://%s:554/onvif-tt/ci/stream0
snapurl=http://%s:8080/snapshot.jpg
type=H264
audio_encoder=AAC
audio_decoder=G711

# Profile 1 — H.264, 640x360 (a "sub" stream).
name=Profile_1
width=640
height=360
url=rtsp://%s:554/onvif-tt/ci/stream1
snapurl=http://%s:8080/snapshot.jpg
type=H264
audio_encoder=AAC
audio_decoder=NONE

events=1
topic=tns1:VideoSource/MotionAlarm
source_name=Source
source_type=tt:ReferenceToken
source_value=VideoSourceToken
input_file=/tmp/onvif_notify_server/motion_alarm
